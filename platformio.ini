; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; On ESP32-C3-DevKitM-1 the USB connector is wired to the chip's built-in
; USB Serial/JTAG (USB VID 303A), not to a UART bridge chip.
; With the core default ARDUINO_USB_CDC_ON_BOOT=0, "Serial" maps to UART0
; (GPIO20/21, the J3 header pins) so nothing shows up on the USB port.
; These two flags make Serial = HWCDC, i.e. the USB port itself.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = partitions.csv
lib_deps = 
    bblanchon/ArduinoJson
    olikraus/U8g2
    IRremote
